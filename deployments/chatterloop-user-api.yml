version: "3.8"
services:
  chatterloop-user-api:
    image: johnpauloramil187/chatterloop_user_api:${IMAGE_TAG:-latest}
    secrets:
      - source: chatterloop-user-api_env
        target: /app/.env
      - source: astra_bundle
        target: /app/secure-connect-chatterloop.zip
    environment:
      - APP_VERSION=${IMAGE_TAG:-latest}
      - FORCE_SCRIPT_NAME=/us
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.chatterloopuserapi.rule=Host(`user.chatterloop.app`)"
        - "traefik.http.routers.chatterloopuserapi.entrypoints=websecure"
        - "traefik.http.routers.chatterloopuserapi.tls.certresolver=letsencrypt"
        - "traefik.http.routers.chatterloopuserapi-gw.rule=Host(`api.chatterloop.app`) && (Path(`/us`) || PathPrefix(`/us/`))"
        - "traefik.http.routers.chatterloopuserapi-gw.entrypoints=websecure"
        - "traefik.http.routers.chatterloopuserapi-gw.tls.certresolver=letsencrypt"
        - "traefik.http.routers.chatterloopuserapi-gw.middlewares=chatterloopuserapi-strip"
        - "traefik.http.routers.chatterloopuserapi-gw.service=chatterloopuserapi"
        - "traefik.http.middlewares.chatterloopuserapi-strip.stripprefix.prefixes=/us"
        - "traefik.http.services.chatterloopuserapi.loadbalancer.server.port=8003"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
    name: traefik-public

secrets:
  chatterloop-user-api_env:
    external: true
  astra_bundle:
    external: true
