version: "3.8"
services:
  chatterloop-realtime-api:
    image: johnpauloramil187/chatterloop_api:${IMAGE_TAG:-latest}
    ports:
      - "10000-10799:10000-10799/udp"
    secrets:
      - source: chatterloop-realtime-api_env
        target: /app/.env
      - source: astra_bundle
        target: /app/secure-connect-chatterloop.zip
    environment:
      - APP_VERSION=${IMAGE_TAG:-latest}
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.chatterlooprealtimeapi.rule=Host(`realtime.chatterloop.app`)"
        - "traefik.http.routers.chatterlooprealtimeapi.entrypoints=websecure"
        - "traefik.http.routers.chatterlooprealtimeapi.tls.certresolver=letsencrypt"
        - "traefik.http.services.chatterlooprealtimeapi.loadbalancer.server.port=3001"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
    name: traefik-public

secrets:
  chatterloop-realtime-api_env:
    external: true
  astra_bundle:
    external: true
